[project]
name = "agentos-api"
version = "0.1.0"
description = "AgentOS FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34.0",
    "supabase>=2.13.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "anthropic>=0.52.0",
    "langgraph>=1.1.0",
    "langgraph-prebuilt>=1.0.0",
    "langchain-anthropic>=1.4.0",
    "langchain-community>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
